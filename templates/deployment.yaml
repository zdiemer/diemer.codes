apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "diemer-codes.fullname" . }}
  labels:
    {{- include "diemer-codes.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # No PVC and no per-pod state — the site is inside the image — so this rolls
  # rather than recreates, and never drops below full capacity.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "diemer-codes.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "diemer-codes.selectorLabels" . | nindent 8 }}
        {{- if .Values.ingress.enabled }}
        # Ships this pod's logs to infra/alloy. Derived from the chart's own
        # ingress switch, so the allowlist cannot drift out of sync.
        logging.zachd/external-ingress: "true"
        {{- end }}
    spec:
      {{- $ips := .Values.imagePullSecrets | default list }}
      {{- if .Values.imageCredentials.pat }}
      {{- $ips = append $ips (dict "name" (printf "%s-ghcr" (include "diemer-codes.fullname" .))) }}
      {{- end }}
      {{- with $ips }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      # Explicit rather than the inherited 30s default, because the preStop
      # sleep below eats into it (same reasoning as web/old-diemer-codes).
      terminationGracePeriodSeconds: 30
      # Required spread + the PDB is what makes a drain provably safe; see the
      # long comment in web/old-diemer-codes, which this chart mirrors.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              {{- include "diemer-codes.selectorLabels" . | nindent 14 }}
      containers:
        - name: nginx
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            # uid/gid of the nginx-unprivileged base image.
            runAsUser: 101
            runAsGroup: 101
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Endpoints removal and SIGTERM are concurrent, not ordered; hold the
          # container open briefly so Traefik stops routing here first. Native
          # sleep action — the read-only distroless-style image cannot exec sh.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          ports:
            - name: http
              containerPort: 8080
          # Static /healthz: if nginx bound the port, the site is there, because
          # the site IS the image. Content failures are caught at image build
          # time by the Dockerfile's asserts instead.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          volumeMounts:
            # readOnlyRootFilesystem is on. nginx writes its pid to /tmp and
            # temp buffers under /var/cache/nginx; without both it exits at
            # startup. Same pair as web/old-diemer-codes and web/kelsey-green.
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: nginx-cache
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
