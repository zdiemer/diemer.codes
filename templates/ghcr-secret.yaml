{{- if .Values.imageCredentials.pat }}
{{/*
docker-registry pull secret for the private GHCR image, built from the PAT in
values.local.yaml so `helm install` is self-contained. The auth string is
base64("username:pat") inside the standard dockerconfigjson envelope. Same
pattern as finance/money.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "diemer-codes.fullname" . }}-ghcr
  labels:
    {{- include "diemer-codes.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ printf "{\"auths\":{\"%s\":{\"auth\":\"%s\"}}}" .Values.imageCredentials.registry (printf "%s:%s" .Values.imageCredentials.username .Values.imageCredentials.pat | b64enc) | b64enc }}
{{- end }}
