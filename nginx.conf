# diemer.codes — Astro static output, served as-is.
#
# Same single-map Cache-Control scheme as web/old-diemer-codes: add_header does
# NOT merge, so one server-level add_header with a map keeps the security
# headers alive on every response. Astro fingerprints everything under /_astro/;
# the top-level files (fonts, images, og.png, favicon) are unhashed and stay
# short-lived.

map $uri $site_cache_control {
    # Astro content-hashes /_astro/* (css, js), immutable forever.
    "~^/_astro/"                 "public, max-age=31536000, immutable";

    # Fonts never change without a redesign, but carry no hash — a day.
    "~^/fonts/"                  "public, max-age=86400";
    "~\.(png|svg|jpg)$"          "public, max-age=86400";

    "/healthz"                   "no-store";

    # HTML, feeds, sitemap, robots: short, so a deploy reaches readers quickly.
    default                      "public, max-age=300";
}

server {
    # 8080: nginx-unprivileged runs as uid 101 and cannot bind 80.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    add_header Cache-Control $site_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # A miss under /_astro/ is a broken build, not a route.
    location /_astro/ {
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Astro writes /writing/<slug>/index.html; trailingSlash "never" means links
    # say /writing/<slug>, so $uri/ (directory index) is the branch that serves
    # them. Unknown paths fall through to the themed 404.
    error_page 404 /404.html;
    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;
}
